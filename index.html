<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de Círculo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Calculadora de área y circunferencia de un círculo</h1>
        <p>Elige qué quieres calcular, escribe el radio y obtén el resultado.</p>
      </header>

      <section class="grid">
        <div class="panel" aria-label="Entrada">
          <div>
            <label>¿Qué deseas calcular?</label>
            <div class="choices" role="radiogroup" aria-label="Tipo de cálculo">
              <div class="choice">
                <input id="opt-area" type="radio" name="calcType" value="area" checked />
                <div class="meta">
                  <span>Área</span>
                  <small>A = π · r²</small>
                </div>
              </div>
              <div class="choice">
                <input id="opt-circ" type="radio" name="calcType" value="circ" />
                <div class="meta">
                  <span>Circunferencia</span>
                  <small>C = 2 · π · r</small>
                </div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="radius">Radio (r)</label>
            <input id="radius" type="number" inputmode="decimal" min="0" step="any" placeholder="Ej: 5" />
            <div class="actions">
              <button class="btn-primary" id="btnCalc" type="button">Calcular</button>
              <button class="btn-secondary" id="btnClear" type="button">Limpiar</button>
            </div>
          </div>
        </div>

        <div class="panel result" aria-label="Resultado">
          <div class="badge" id="badge">
            <span class="dot" aria-hidden="true"></span>
            <span id="badgeText">Área</span>
          </div>

          <div class="value" id="resultValue">—</div>
          <div class="muted" id="resultUnit">Ingresa un radio para calcular.</div>

          <div class="formula" id="formula">A = π · r²</div>
          <div id="errorBox" class="error" hidden></div>

          <div class="footer">Usa π = 3.141592653589793 (Math.PI)</div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

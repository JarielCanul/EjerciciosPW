<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrusel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Carrusel de imágenes (con arreglo)</h1>
        <div class="hint">Usa ◀ ▶ o las teclas ← →</div>
      </header>

      <section class="carousel" aria-label="Carrusel de imágenes">
        <img id="slide" alt="" />
        <div class="nav">
          <button id="prev" type="button" aria-label="Anterior">◀</button>
          <button id="next" type="button" aria-label="Siguiente">▶</button>
        </div>
      </section>

      <footer class="footer">
        <div id="counter" class="counter" aria-live="polite"></div>
        <div id="dots" class="dots" aria-label="Seleccionar imagen"></div>
      </footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
